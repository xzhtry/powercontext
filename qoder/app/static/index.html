<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="研脉 ResearchThread — 把散落的论文，接成可复用的研究脉络。">
  <title>研脉 · ResearchThread</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/today" aria-label="研脉 ResearchThread">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 44 44" fill="none">
            <path d="M8 31C14 22 18 33 24 22C29 13 34 15 37 10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="8" cy="31" r="3.2" fill="currentColor"/>
            <circle cx="24" cy="22" r="3.2" fill="currentColor"/>
            <circle cx="37" cy="10" r="3.2" fill="currentColor"/>
            <path d="M8 31L24 22L37 10" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4" opacity=".55"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>研脉</strong>
          <small>ResearchThread</small>
        </span>
      </a>

      <nav class="nav" aria-label="主导航">
        <a class="nav-item is-active" href="#/today" data-view="today">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5 9 17l11-11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 19h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <span>今日研究台</span>
        </a>
        <a class="nav-item" href="#/library" data-view="library">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <span>文献库</span>
        </a>
        <a class="nav-item" href="#/evidence" data-view="evidence">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M5 4.5h14v15H5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
          <span>证据表</span>
          <span class="nav-count" id="nav-evidence-count">0</span>
        </a>
        <a class="nav-item" href="#/synthesis" data-view="synthesis">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M5 19V5h9l5 5v9z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 5v5h5M8 13h8M8 16.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
          <span>综述台</span>
        </a>
        <a class="nav-item" href="#/memory" data-view="memory">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 4.5a4 4 0 0 0-4 4v.6A3.4 3.4 0 0 0 7 15.4V16a4 4 0 0 0 5 3.8 4 4 0 0 0 5-3.8v-.6a3.4 3.4 0 0 0-1-6.3v-.6a4 4 0 0 0-4-4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 8v8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".6"/></svg>
          </span>
          <span>研究记忆</span>
          <span class="nav-count ghost" id="nav-memory-count">0</span>
        </a>
      </nav>

      <div class="sidebar-note">
        <p class="eyebrow">本地优先</p>
        <p>论文与证据在 seekdb；研究决策在 PowerContext。关掉再打开，脉络还在。</p>
      </div>

      <div class="sidebar-foot">
        <div class="status-row">
          <span class="status-dot" id="seekdb-dot"></span>
          <span>seekdb <b id="seekdb-state">连接中</b></span>
        </div>
        <div class="status-row">
          <span class="status-dot" id="pc-dot"></span>
          <span>PowerContext <b id="pc-state">连接中</b></span>
        </div>
        <button class="sidebar-session" id="new-session-btn" type="button">
          <span>开始新会话</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" type="button" aria-label="打开菜单">
          <span></span><span></span><span></span>
        </button>
        <div class="topbar-title">
          <span class="topbar-kicker" id="topbar-kicker">研究工作台</span>
          <h1 id="topbar-title">今日研究台</h1>
        </div>
        <div class="topbar-actions">
          <button class="ghost-btn search-jump" id="search-jump" type="button">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span>检索文献</span>
            <kbd>/</kbd>
          </button>
          <div class="date-chip" id="date-chip"></div>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1">
        <div class="loading-state">
          <div class="loading-mark"></div>
          <p>正在打开你的研究脉络…</p>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="/assets/app.js" defer></script>
</body>
</html>
