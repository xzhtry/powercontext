version: 0.1.5
kind: app
app:
  name: 记仇客栈 · Grudge Inn
  mode: advanced-chat
  icon: 🏮
  icon_background: '#FFF3E0'
  description: 你负责捣蛋，AI 负责记仇。一个会用 seekdb 检索江湖素材、用 PowerContext 跨会话记住你恶作剧的互动客栈。
  use_icon_as_answer_icon: false
workflow:
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 260
      positionAbsolute:
        x: 80
        y: 260
      width: 244
      height: 100
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: start
        title: 开始 · 报上名号
        desc: ''
        selected: false
        variables:
        - type: text-input
          label: 玩家名号（用于跨会话记忆）
          variable: player_id
          required: false
          max_length: 64
          default: demo-player
          hint: 同一个名号 = 同一个会被记仇的江湖人；支持中文、字母、数字、_、-
    - id: prepare
      type: custom
      position:
        x: 360
        y: 260
      positionAbsolute:
        x: 360
        y: 260
      width: 244
      height: 100
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: http-request
        title: 1. 读记忆 + 检索江湖卡
        desc: ''
        selected: false
        method: post
        url: http://host.docker.internal:8787/v1/turn/prepare?format=text&player_id={{#start.player_id#}}
        authorization:
          type: no-auth
          config: null
        headers: 'Content-Type: text/plain; charset=utf-8'
        params: ''
        body:
          type: raw-text
          data:
          - key: ''
            type: text
            value: '{{#sys.query#}}'
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 30
          max_write_timeout: 10
        retry_config:
          retry_enabled: false
          max_retries: 0
          retry_interval: 100
        variables: []
    - id: narrate
      type: custom
      position:
        x: 640
        y: 260
      positionAbsolute:
        x: 640
        y: 260
      width: 244
      height: 100
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: llm
        title: 2. 说书人写场景
        desc: ''
        selected: false
        model:
          provider: openai_api_compatible
          name: grudge-narrator
          mode: chat
          completion_params:
            temperature: 0.85
            max_tokens: 500
        prompt_template:
        - role: system
          text: '你是《记仇客栈》的说书人，用中文第二人称写一段互动小说。


            你会收到一份【本回合场景简报】。其中的成败、数值、NPC 态度、报复和阶段结局都是已经发生的“事实”，你不能改写，也不能用“也许”“似乎”来推翻。


            写作规则：

            1. 只写 120-220 字正文，不要标题、列表、JSON、数值面板、系统提示或解释。

            2. 必须写出目标 NPC 的具体动作或一句台词。柳三娘嘴毒心软，阿福憨直记仇，乌云是只黑猫。

            3. 有【前情记忆】时，自然回扣至少一个旧梗，让玩家感到“它真的记得”；没有前情时写初次见面。

            4. 有【报复】时，必须在正文里发生；有【阶段结局】时，用一句有仪式感的话收束，但不要结束对话。

            5. 结尾留一个让人想继续玩的钩子，但不要向玩家提问。

            6. 基调：江湖、烟火气、好笑但不低俗；不要解释规则，不要跳出角色。'
        - role: user
          text: '【本回合场景简报】

            {{#prepare.body#}}


            请直接写正文。'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        memory:
          window:
            enabled: false
            size: 10
          role_prefix:
            user: ''
            assistant: ''
        variables: []
    - id: commit
      type: custom
      position:
        x: 920
        y: 260
      positionAbsolute:
        x: 920
        y: 260
      width: 244
      height: 100
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: http-request
        title: 3. 落账 + 写记忆
        desc: ''
        selected: false
        method: post
        url: http://host.docker.internal:8787/v1/turn/commit?player_id={{#start.player_id#}}
        authorization:
          type: no-auth
          config: null
        headers: 'Content-Type: text/plain; charset=utf-8'
        params: ''
        body:
          type: raw-text
          data:
          - key: ''
            type: text
            value: '{{#narrate.text#}}'
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 30
          max_write_timeout: 10
        retry_config:
          retry_enabled: false
          max_retries: 0
          retry_interval: 100
        variables: []
    - id: answer
      type: custom
      position:
        x: 1200
        y: 260
      positionAbsolute:
        x: 1200
        y: 260
      width: 244
      height: 100
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: answer
        title: 4. 把这一页给你看
        desc: ''
        selected: false
        answer: '{{#commit.body#}}'
        variables: []
    edges:
    - id: start-prepare
      source: start
      sourceHandle: source
      target: prepare
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: start
        targetType: http-request
    - id: prepare-narrate
      source: prepare
      sourceHandle: source
      target: narrate
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: http-request
        targetType: llm
    - id: narrate-commit
      source: narrate
      sourceHandle: source
      target: commit
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: llm
        targetType: http-request
    - id: commit-answer
      source: commit
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: http-request
        targetType: answer
    viewport:
      x: 0
      y: 0
      zoom: 0.85
  features:
    file_upload:
      enabled: false
      allowed_file_types:
      - image
      allowed_file_extensions:
      - .jpg
      - .jpeg
      - .png
      - .webp
      allowed_file_upload_methods:
      - local_file
      - remote_url
      number_limits: 3
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: '**欢迎来到记仇客栈。**


      你负责捣蛋，AI 负责记仇。


      这里的每一笔账，都会跨会话记住：你藏过谁的鞋、往谁的茶里加过盐、又欠了谁一句道歉。


      报上名号，推门吧。'
    suggested_questions:
    - 我把阿福的鞋藏到房梁上
    - 给柳三娘送一碟桂花糕，夸她年轻
    - 偷偷翻开柜台的账本
    - 我回来了，柳三娘还记不记得我
    suggested_questions_after_answer:
      enabled: false
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  environment_variables: []
  conversation_variables: []
