[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sddctx"
version = "0.1.0"
description = "规有所依：面向软件持续演进的 SDD 上下文管理模块"
requires-python = ">=3.11"
dependencies = [
    "pylibseekdb>=1.4.0.post1,<2; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sddctx = "sddctx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
