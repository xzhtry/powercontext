[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoicehub"
version = "0.3.0"
description = "财务发票查询小服务，用于 SDD 上下文管理演示"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
invoicehub = "invoicehub.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
